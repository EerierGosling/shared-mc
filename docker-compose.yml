services:
  minecraft:
    image: itzg/minecraft-server:latest
    environment:
      EULA: "TRUE"
      TYPE: "VANILLA"
      VERSION: "1.20.4"
      ONLINE_MODE: "FALSE"
      MEMORY: "2G"
      DIFFICULTY: "normal"
      MODE: "survival"
      OPS: "StreamBot"
      VIEW_DISTANCE: "10"
    ports:
      - "25565:25565"
    volumes:
      - mc-data:/data

  app:
    build: .
    depends_on:
      - minecraft
    environment:
      MC_HOST: minecraft
      MC_PORT: "25565"
      MC_VERSION: "1.20.4"
      MC_USERNAME: StreamBot
      MC_AUTH: offline
      PORT: "3000"
      VIEW_DISTANCE: "6"
    ports:
      - "3000:3000"

volumes:
  mc-data: {}
