<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Phone Controller</title>
  <link rel="stylesheet" href="/ui.css">
  <link rel="stylesheet" href="/motion.css">
</head>
<body class="companion mc-dirt">
  <main class="mc-panel">
    <h1>Phone Controller</h1>
    <p>On the game screen, open Motion Controls → Phone. Scan its QR code or enter the pairing code below.</p>
    <form id="pair-form">
      <label class="section-label" for="pair-code">Pairing code</label>
      <input id="pair-code" class="mc-text" type="text" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false" required pattern="[A-Za-z0-9\s\-]{6,20}" placeholder="6-character code">
      <button id="pair-connect" class="mc-button" type="submit">Connect to Game</button>
    </form>
    <p id="pair-status" role="status">Connecting to the site…</p>
    <button id="pair-disconnect" class="mc-button" type="button" hidden>Disconnect from Game</button>
    <button id="show-controls" class="mc-button" type="button" hidden>Show Phone Controls</button>
    <div id="motion-mount"></div>
    <small>This controller uses only the phone accelerometer for mining. Keep this page visible and the screen awake. Motion access requires HTTPS.</small>
    <a class="mc-button" href="/">Back to Game</a>
  </main>
  <script src="/dist/controller.js"></script>
</body>
</html>
