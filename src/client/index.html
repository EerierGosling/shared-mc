<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared Minecraft</title>
<style>
  /* Monocraft (SIL OFL) stands in for Minecraft's own font, which we cannot
     redistribute. See fonts/Monocraft-OFL.txt. */
  @font-face {
    font-family: 'Monocraft';
    src: url('/fonts/Monocraft.ttf') format('truetype');
    font-display: swap;
  }

  :root {
    /* Vanilla's GUI scale. Every HUD measurement below is written in texture
       pixels multiplied by this, so the whole interface rescales from here.
       Vanilla picks this from the window size too; see the media query below. */
    --px: 2;
    --u: calc(var(--px) * 1px);

    /* Minecraft draws text with a hard 1px shadow at 25% brightness. */
    --shadow: #3f3f3f;

    /* Container GUI palette, straight off the vanilla widget textures. */
    --gui: #c6c6c6;
    --gui-lit: #ffffff;
    --gui-dim: #555555;
    --slot: #8b8b8b;
    --slot-dark: #373737;
    --ink: #404040;

    /* Vanilla's in-chat colour codes, used for status text. */
    --mc-white: #ffffff;
    --mc-gray: #aaaaaa;
    --mc-green: #55ff55;
    --mc-yellow: #ffff55;
    --mc-red: #ff5555;
  }

  @media (min-width: 1800px) and (min-height: 1000px) {
    :root { --px: 3; }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #000; color: var(--mc-white);
    font-family: 'Monocraft', ui-monospace, Menlo, Consolas, monospace;
    font-size: calc(var(--px) * 8px);
    line-height: 1.25;
    /* Pixel fonts must not be antialiased or the glyph edges go soft. */
    -webkit-font-smoothing: none;
    font-smooth: never;
  }

  /* Every sprite here is a 9-to-22px texture blown up several times over;
     without this the browser would smooth them into mush. */
  img, .sprite, .sprite::after { image-rendering: pixelated; }

  #viewport { display: block; width: 100%; height: 100%; }

  .overlay { position: fixed; pointer-events: none; }

  .shadowed { text-shadow: var(--u) var(--u) 0 var(--shadow); }

  /* --- crosshair ---------------------------------------------------------- */
  /* Vanilla inverts whatever is behind it rather than drawing solid white. */
  #crosshair {
    left: 50%; top: 50%;
    width: calc(15 * var(--u)); height: calc(15 * var(--u));
    transform: translate(-50%, -50%);
    background: url('/assets/gui/sprites/hud/crosshair.png') center/contain no-repeat;
    mix-blend-mode: difference;
  }

  /* --- tooltip-style panels ----------------------------------------------- */
  /* The purple-bordered box vanilla uses for item tooltips. */
  .tooltip {
    background: rgba(16, 0, 16, 0.94);
    border: var(--u) solid #2d0a63;
    padding: calc(2 * var(--u)) calc(3 * var(--u));
    box-shadow: inset 0 0 0 var(--u) rgba(80, 0, 255, 0.28);
  }

  #status {
    top: calc(3 * var(--u)); left: 50%; transform: translateX(-50%);
    color: var(--mc-yellow);
  }
  #status[data-state="connected"] { color: var(--mc-green); }
  #status[data-state="error"] { color: var(--mc-red); }

  /* The coordinate readout apes the F3 debug overlay: plain translucent black. */
  #stats {
    top: calc(2 * var(--u)); left: calc(2 * var(--u));
    padding: calc(1 * var(--u)) calc(2 * var(--u));
    background: rgba(0, 0, 0, 0.5);
    white-space: pre;
  }
  #stats b { color: var(--mc-yellow); font-weight: normal; }

  #hint {
    bottom: calc(4 * var(--u)); right: calc(4 * var(--u));
    color: var(--mc-gray);
  }
  #hint b { color: var(--mc-white); font-weight: normal; }

  /* --- minimap -------------------------------------------------------------- */
  /* One texture pixel per block, so the map rescales with the GUI like every
     other sprite. Hidden until the first frame arrives from the server. */
  #minimap {
    top: calc(2 * var(--u)); right: calc(2 * var(--u));
    padding: var(--u);
    background: rgba(0, 0, 0, 0.5);
    display: none;
  }
  #minimap.live { display: block; }
  #minimap canvas {
    display: block;
    width: calc(64 * var(--u)); height: calc(64 * var(--u));
    image-rendering: pixelated;
  }
  #minimap-arrow {
    position: absolute; left: 50%; top: 50%;
    width: calc(7 * var(--u)); height: calc(7 * var(--u));
    background: var(--mc-white);
    clip-path: polygon(50% 0%, 100% 100%, 50% 70%, 0% 100%);
    transform: translate(-50%, -50%);
    filter: drop-shadow(var(--u) var(--u) 0 var(--shadow));
  }

  /* --- hearts and hunger --------------------------------------------------- */
  /* Both rows sit inside the hotbar's own 182px width, as they do in game. */
  #hud-bars {
    bottom: calc(26 * var(--u)); left: 50%; transform: translateX(-50%);
    width: calc(182 * var(--u));
    display: flex; justify-content: space-between;
  }
  .icon-row { display: flex; }
  /* Vanilla spaces these 8px apart though each icon is 9px, so they overlap. */
  .icon-row i {
    width: calc(9 * var(--u)); height: calc(9 * var(--u));
    margin-right: calc(-1 * var(--u));
    background-size: contain; background-repeat: no-repeat;
  }
  #food { flex-direction: row-reverse; }
  #food i { margin-right: 0; margin-left: calc(-1 * var(--u)); }

  /* --- hotbar -------------------------------------------------------------- */
  /* The 182x22 hotbar texture: 1px frame, then nine 20px slots. */
  #hotbar {
    bottom: calc(2 * var(--u)); left: 50%; transform: translateX(-50%);
    width: calc(182 * var(--u)); height: calc(22 * var(--u));
    padding: var(--u);
    display: flex;
    background: url('/assets/gui/sprites/hud/hotbar.png') center/contain no-repeat;
  }
  .slot {
    width: calc(20 * var(--u)); height: calc(20 * var(--u));
    position: relative; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--px) * 6px); color: var(--mc-gray);
    text-align: center; overflow: hidden; word-break: break-all;
  }
  /* The selection frame is 24x23 and overhangs the slot by 1px on every side. */
  #hotbar .slot.selected::after {
    content: ''; position: absolute;
    left: calc(-2 * var(--u)); top: calc(-2 * var(--u));
    width: calc(24 * var(--u)); height: calc(23 * var(--u));
    background: url('/assets/gui/sprites/hud/hotbar_selection.png') center/contain no-repeat;
  }
  .slot img { width: calc(16 * var(--u)); height: calc(16 * var(--u)); }
  .slot .count {
    position: absolute; right: 0; bottom: 0;
    font-size: calc(var(--px) * 8px); color: var(--mc-white);
    text-shadow: var(--u) var(--u) 0 var(--shadow);
  }

  /* --- chat ---------------------------------------------------------------- */
  #chat {
    bottom: calc(26 * var(--u)); left: calc(2 * var(--u));
    width: min(46vw, 480px);
    display: flex; flex-direction: column;
  }
  #chat-log {
    max-height: 30vh; overflow: hidden;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  #chat-log div {
    background: rgba(0, 0, 0, 0.5);
    padding: 0 var(--u);
    word-break: break-word;
    text-shadow: var(--u) var(--u) 0 var(--shadow);
  }
  #chat-log div.system { color: var(--mc-yellow); }
  #chat-input {
    display: none; pointer-events: auto; width: 100%;
    margin-top: var(--u);
    padding: calc(1.5 * var(--u)) calc(2 * var(--u));
    color: var(--mc-white);
    background: rgba(0, 0, 0, 0.5);
    border: var(--u) solid #a0a0a0;
    font: inherit; outline: none;
    text-shadow: var(--u) var(--u) 0 var(--shadow);
  }
  #chat-input.open { display: block; }
  #chat-input::placeholder { color: #7f7f7f; }

  /* --- inventory ----------------------------------------------------------- */
  #inventory {
    inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, 0.6); pointer-events: auto;
  }
  #inventory.open { display: flex; }

  /* Vanilla container chrome: light bevel top-left, dark bevel bottom-right. */
  #inventory-panel {
    background: var(--gui);
    border-style: solid;
    border-width: calc(2 * var(--u));
    border-color: var(--gui-lit) var(--gui-dim) var(--gui-dim) var(--gui-lit);
    padding: calc(3 * var(--u));
    min-width: calc(176 * var(--u));
    color: var(--ink);
  }
  #inventory-panel h2 {
    margin: 0 0 calc(2 * var(--u));
    font-size: calc(var(--px) * 8px); font-weight: normal;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  #inventory-panel h2 small { color: #7f7f7f; font-size: calc(var(--px) * 6px); }
  .section-label {
    color: #7f7f7f; margin: 0 0 var(--u);
    font-size: calc(var(--px) * 6px);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(9, calc(18 * var(--u)));
    gap: var(--u);
    margin-bottom: calc(2 * var(--u));
  }
  /* Slots are inset: the bevel runs the other way round from the panel. */
  .grid .slot {
    width: calc(18 * var(--u)); height: calc(18 * var(--u));
    background: var(--slot);
    background-size: calc(16 * var(--u)) calc(16 * var(--u));
    background-position: center; background-repeat: no-repeat;
    border-style: solid; border-width: var(--u);
    border-color: var(--slot-dark) var(--gui-lit) var(--gui-lit) var(--slot-dark);
    cursor: pointer; color: var(--ink);
  }
  .grid .slot:hover { background-color: #c5c5c5; }
  .grid .slot.drag-target { background-color: #d8d8a0; }
  .grid .slot img { width: calc(16 * var(--u)); height: calc(16 * var(--u)); }
  .grid .slot .count { color: var(--mc-white); }

  /* The item currently picked up, following the mouse while the inventory is open. */
  #cursor-item {
    position: fixed; left: 0; top: 0; z-index: 20;
    pointer-events: none; display: none;
    transform: translate(calc(-10 * var(--u)), calc(-10 * var(--u)));
  }
  #cursor-item.visible { display: flex; }

  /* --- crafting row: armor, player bust, offhand, 2x2 crafting ------------- */
  .crafting-row { display: flex; align-items: flex-start; gap: calc(4 * var(--u)); margin-bottom: calc(3 * var(--u)); }
  .grid.grid-1 { grid-template-columns: repeat(1, calc(18 * var(--u))); margin-bottom: 0; }
  .grid.grid-2 { grid-template-columns: repeat(2, calc(18 * var(--u))); margin-bottom: 0; }
  .grid.grid-3 { grid-template-columns: repeat(3, calc(18 * var(--u))); margin-bottom: 0; }

  .player-frame {
    position: relative;
    width: calc(40 * var(--u)); height: calc(52 * var(--u));
    background: var(--slot);
    border-style: solid; border-width: var(--u);
    border-color: var(--slot-dark) var(--gui-lit) var(--gui-lit) var(--slot-dark);
  }
  .player-figure {
    position: absolute; left: 50%; top: calc(4 * var(--u));
    transform: translateX(-50%);
    width: calc(18 * var(--u)); height: calc(44 * var(--u));
  }
  .player-figure i { position: absolute; display: block; }
  .p-hair { top: 0; left: calc(3 * var(--u)); width: calc(12 * var(--u)); height: calc(4 * var(--u)); background: #4a3728; }
  .p-head { top: calc(4 * var(--u)); left: calc(3 * var(--u)); width: calc(12 * var(--u)); height: calc(12 * var(--u)); background: #f0b48c; }
  .p-body { top: calc(16 * var(--u)); left: calc(3 * var(--u)); width: calc(12 * var(--u)); height: calc(16 * var(--u)); background: #17a5a0; }
  .p-arm { top: calc(16 * var(--u)); width: calc(3 * var(--u)); height: calc(16 * var(--u)); background: #f0b48c; }
  .p-arm-l { left: 0; }
  .p-arm-r { right: 0; }
  .p-leg { top: calc(32 * var(--u)); width: calc(6 * var(--u)); height: calc(12 * var(--u)); background: #3b5bdb; }
  .p-leg-l { left: calc(3 * var(--u)); }
  .p-leg-r { left: calc(9 * var(--u)); }
  .offhand-wrap { position: absolute; right: calc(-1 * var(--u)); bottom: calc(-1 * var(--u)); }

  .crafting-col { display: flex; flex-direction: column; }
  .crafting-main { display: flex; align-items: center; gap: calc(3 * var(--u)); margin-bottom: calc(3 * var(--u)); }
  .crafting-arrow { font-size: calc(var(--px) * 10px); color: var(--ink); padding: 0 var(--u); }

  /* --- crafting table: recipe-book stand-in, 3x3 grid, output --------------- */
  .workbench-icon {
    width: calc(18 * var(--u)); height: calc(18 * var(--u));
    flex: none;
    background: #4a9c46;
    border-style: solid; border-width: var(--u);
    border-color: #6fc768 #1f4a1c #1f4a1c #6fc768;
  }
</style>
</head>
<body>
  <canvas id="viewport"></canvas>

  <div id="crosshair" class="overlay"></div>
  <div id="status" class="overlay tooltip shadowed" data-state="connecting">connecting&hellip;</div>
  <div id="stats" class="overlay shadowed"></div>

  <div id="minimap" class="overlay">
    <canvas id="minimap-canvas" width="64" height="64"></canvas>
    <div id="minimap-arrow"></div>
  </div>

  <div id="hud-bars" class="overlay">
    <div id="health" class="icon-row"></div>
    <div id="food" class="icon-row"></div>
  </div>

  <div id="hotbar" class="overlay"></div>

  <div id="chat" class="overlay">
    <div id="chat-log"></div>
    <input id="chat-input" maxlength="256" placeholder="say something&hellip;" autocomplete="off">
  </div>

  <div id="hint" class="overlay tooltip shadowed">
    <b>click</b> to play &nbsp; <b>WASD</b> move &nbsp; <b>space</b> jump<br>
    <b>LMB</b> mine &nbsp; <b>RMB</b> use/place &nbsp; <b>1-9</b> hotbar<br>
    <b>E</b> inventory &nbsp; <b>T</b> chat &nbsp; <b>Q</b> drop &nbsp; <b>G</b> walk to cursor
  </div>

  <div id="inventory" class="overlay">
    <div id="inventory-panel">
      <h2><span id="inventory-title">Inventory</span> <small>E or Esc to close</small></h2>
      <div id="inventory-body"></div>
    </div>
    <div id="cursor-item" class="slot"></div>
  </div>

  <script src="/dist/bundle.js"></script>
</body>
</html>
